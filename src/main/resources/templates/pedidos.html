<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary" th:if="${podeRegistrarPedidos}">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente ID</th>
                        <th>Itens</th>
                        <th>Valor total</th>
                        <th>Registrado por</th>
                        <th>Entrada</th>
                        <th>Saída</th>
                        <th>Status</th>
                        <th th:if="${podeGerenciarPedidos}">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td th:colspan="${podeGerenciarPedidos ? 9 : 8}" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}"
                        th:with="proximos=${pedido.status != null ? transicoesPedido[pedido.status] : null},
                                 antesDaSaida=${pedido.dataHoraSaida == null and pedido.status != null and statusAntesDaSaida.contains(pedido.status)}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td>
                            <div th:each="item : ${pedido.itens}">
                                <span th:text="${item.quantidade}"></span> ×
                                <span th:text="${item.nomeProduto}"></span>
                                <small class="text-muted" th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></small>
                            </div>
                            <div th:if="${#lists.isEmpty(pedido.itens)}">
                                <span th:text="${pedido.tipoPizza}"></span>
                                <span th:text="${pedido.sabor}"></span>
                                <span th:text="${pedido.quantidade}"></span>
                            </div>
                        </td>
                        <td>
                            <span th:text="${pedido.valorTotal != null ? 'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA') : '—'}"></span>
                            <small class="d-block text-muted" th:if="${pedido.descontoPercentual != null and pedido.descontoPercentual > 0}"
                                   th:text="${'Desconto: ' + #numbers.formatDecimal(pedido.descontoPercentual, 1, 'POINT', 2, 'COMMA') + '%'}"></small>
                        </td>
                        <td th:text="${pedido.responsavelRegistro ?: '—'}"></td>
                        <td th:text="${pedido.dataHoraEntrada != null ? #temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                        <td>
                            <span th:text="${pedido.dataHoraSaida != null ? #temporals.format(pedido.dataHoraSaida, 'dd/MM/yyyy HH:mm') : '—'}"></span>
                            <small class="d-block text-muted" th:if="${pedido.responsavelSaida}"
                                   th:text="${pedido.responsavelSaida}"></small>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARACAO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${#strings.replace(pedido.status, '_', ' ')}">
                            </span>
                            <small class="d-block text-muted mt-1" th:if="${pedido.justificativaCancelamento}"
                                   th:text="${pedido.justificativaCancelamento}"></small>
                        </td>
                        <td th:if="${podeGerenciarPedidos}">
                            <form th:if="${proximos != null and !#lists.isEmpty(proximos)}"
                                  th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post"
                                  class="d-flex gap-2">
                                <select name="status" class="form-select form-select-sm" aria-label="Próximo status" required>
                                    <option th:each="proximo : ${proximos}" th:value="${proximo}"
                                            th:text="${#strings.replace(proximo, '_', ' ')}"></option>
                                </select>
                                <button type="submit" class="btn btn-primary btn-sm">Atualizar</button>
                            </form>
                            <div th:if="${antesDaSaida}" class="mt-2">
                                <details class="mb-2">
                                    <summary class="text-primary">Aplicar desconto</summary>
                                    <form th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post" class="mt-2">
                                        <label class="form-label small">
                                            Desconto (%)
                                            <input type="number" name="percentual" class="form-control form-control-sm"
                                                   min="0" max="20" step="0.01" required
                                                   th:value="${pedido.descontoPercentual ?: 0}">
                                        </label>
                                        <button type="submit" class="btn btn-outline-primary btn-sm">Aplicar</button>
                                    </form>
                                </details>
                                <details>
                                    <summary class="text-danger">Cancelar pedido</summary>
                                    <form th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post" class="mt-2">
                                        <label class="form-label small">
                                            Justificativa do cancelamento
                                            <textarea name="justificativa" class="form-control form-control-sm" rows="2" required></textarea>
                                        </label>
                                        <button type="submit" class="btn btn-outline-danger btn-sm">Cancelar pedido</button>
                                    </form>
                                </details>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
